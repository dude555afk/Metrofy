name: Metrofy Nova Preview APK

on:
  push:
    branches:
      - feature/soundpod-ui-nova
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: metrofy-nova-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Metrofy Nova from Metrofy source
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      METROFY_NOVA_PREVIEW: "true"

    steps:
      - name: Checkout Metrofy
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Create Android debug signing key
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Metrofy Nova FOSS debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-configuration-cache --console=plain :app:assembleFossDebug --warning-mode summary

      - name: Verify APK identity
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk -type f -name '*.apk' -path '*foss/debug*' -print -quit)"
          test -n "$apk"

          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$aapt"
          test -n "$apksigner"
          "$apksigner" verify "$apk"

          "$aapt" dump badging "$apk" > /tmp/nova-badging.txt
          head -n 1 /tmp/nova-badging.txt
          grep -F "name='com.metrofy.nova'" /tmp/nova-badging.txt
          grep -F "versionName='0.1.0-nova.1'" /tmp/nova-badging.txt
          grep -F "application-label:'Metrofy Nova'" /tmp/nova-badging.txt

          mkdir -p nova-output
          cp "$apk" nova-output/Metrofy-Nova-Preview.apk

      - name: Upload Metrofy Nova APK
        uses: actions/upload-artifact@v6
        with:
          name: Metrofy-Nova-Preview
          path: nova-output/Metrofy-Nova-Preview.apk
          if-no-files-found: error
          retention-days: 90
