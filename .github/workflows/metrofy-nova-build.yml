name: Metrofy Nova Preview APK

on:
  push:
    branches:
      - feature/soundpod-ui-nova
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: metrofy-nova-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build SoundPod-based Nova preview
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Metrofy Nova build scripts
        uses: actions/checkout@v6
        with:
          path: metrofy

      - name: Checkout pinned SoundPod source
        uses: actions/checkout@v6
        with:
          repository: arunnechully/SoundPod
          ref: 03dcb75b0158eb5c8dccbd82a131e8bce09a876d
          path: nova-source

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-disabled: true

      - name: Rebrand the pinned source for Metrofy Nova
        run: python3 metrofy/scripts/prepare-metrofy-nova.py nova-source

      - name: Build Nova release APK
        working-directory: nova-source
        run: |
          chmod +x gradlew
          ./gradlew --no-configuration-cache --console=plain assembleFdroidRelease --warning-mode summary

      - name: Verify APK identity and package source
        shell: bash
        run: |
          set -euo pipefail
          apk_dir="nova-source/app/build/outputs/apk/fdroid/release"
          apk="$(find "$apk_dir" -maxdepth 1 -type f -name '*universal*.apk' -print -quit)"
          if [[ -z "$apk" ]]; then
            apk="$(find "$apk_dir" -maxdepth 1 -type f -name '*.apk' -print -quit)"
          fi
          test -n "$apk"

          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$aapt"
          test -n "$apksigner"
          "$apksigner" verify "$apk"

          "$aapt" dump badging "$apk" > /tmp/nova-badging.txt
          head -n 1 /tmp/nova-badging.txt
          grep -F "name='com.metrofy.nova'" /tmp/nova-badging.txt
          grep -F "versionName='0.1.0-nova.1'" /tmp/nova-badging.txt
          grep -F "application-label:'Metrofy Nova'" /tmp/nova-badging.txt

          mkdir -p metrofy/nova-output
          cp "$apk" metrofy/nova-output/Metrofy-Nova-Preview.apk

          cp metrofy/nova/SOUNDPOD_BASE.md nova-source/METROFY_NOVA_SOURCE_NOTES.md
          cp metrofy/scripts/prepare-metrofy-nova.py nova-source/prepare-metrofy-nova.py
          cd nova-source
          zip -qr ../metrofy/nova-output/Metrofy-Nova-Source.zip . \
            -x "./.git/*" "*/.git/*" "./.gradle/*" "*/.gradle/*" \
               "*/build/*" "./local.properties" "*/local.properties"

      - name: Upload APK and reproducible source
        uses: actions/upload-artifact@v6
        with:
          name: Metrofy-Nova-Preview
          path: |
            metrofy/nova-output/Metrofy-Nova-Preview.apk
            metrofy/nova-output/Metrofy-Nova-Source.zip
          if-no-files-found: error
          retention-days: 90
