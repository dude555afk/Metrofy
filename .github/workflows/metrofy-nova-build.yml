name: Metrofy Nova Preview APK

on:
  push:
    branches:
      - feature/soundpod-ui-nova
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: metrofy-nova-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build isolated Nova APK
    runs-on: ubuntu-latest
    env:
      METROFY_NOVA_PREVIEW: "true"
      PULL_REQUEST: "false"
      GITHUB_EVENT_NAME: ${{ github.event_name }}
      LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
      LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}

    steps:
      - uses: actions/checkout@v6
      - name: Initialize protobuf submodule
        run: git submodule update --init metroproto

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-disabled: true
      - uses: ./.github/actions/setup-protobuf

      - name: Build Nova release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-configuration-cache --console=plain assembleFossRelease :app:lintFossRelease --warning-mode summary

      - name: Sign Nova APK
        uses: ilharp/sign-android-release@v2.0.0
        with:
          releaseDir: app/build/outputs/apk/foss/release/
          signingKey: ${{ secrets.KEYSTORE }}
          keyAlias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
          buildToolsVersion: 35.0.0

      - name: Verify separate Nova identity
        shell: bash
        run: |
          set -euo pipefail
          dir="app/build/outputs/apk/foss/release"
          apk="$(find "$dir" -maxdepth 1 -name '*-signed.apk' -print -quit)"
          test -n "$apk"
          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$apksigner" verify "$apk"
          "$aapt" dump badging "$apk" | head -n 1 | tee /tmp/nova-identity.txt
          grep -F "name='com.metrofy.nova'" /tmp/nova-identity.txt
          grep -F "versionName='0.1.0-nova.1'" /tmp/nova-identity.txt
          mkdir -p nova-output
          cp "$apk" nova-output/Metrofy-Nova-Preview.apk

      - name: Upload Nova APK
        uses: actions/upload-artifact@v6
        with:
          name: Metrofy-Nova-Preview
          path: nova-output/Metrofy-Nova-Preview.apk
          if-no-files-found: error
