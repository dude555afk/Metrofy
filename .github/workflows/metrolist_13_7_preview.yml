name: Metrolist 13.7 Backport Preview

on:
  push:
    branches:
      - "update/metrolist-13.7.0"
    paths:
      - "app/build.gradle.kts"
      - ".github/workflows/metrolist_13_7_preview.yml"

permissions:
  contents: write

concurrency:
  group: metrofy-metrolist-13-7-preview
  cancel-in-progress: true

jobs:
  build:
    name: Build Preview (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - variant: foss
            variantName: Foss
            outputName: Metrofy-13.7-preview.apk
          - variant: gms
            variantName: Gms
            outputName: Metrofy-13.7-preview-with-Google-Cast.apk

    steps:
      - uses: actions/checkout@v6

      - name: Init metroproto submodule
        run: git submodule update --init metroproto

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_KEY }}
          cache-cleanup: on-success

      - name: Setup and Generate Protobuf
        uses: ./.github/actions/setup-protobuf

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build preview APK
        run: ./gradlew --console=plain assemble${{ matrix.variantName }}Release :app:lint${{ matrix.variantName }}Release --warning-mode summary
        env:
          METROLIST_APPLICATION_ID: com.metrofy.app
          METROLIST_APP_NAME: Metrofy Preview
          PULL_REQUEST: "false"
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          CRASH_REPORT_TOKEN: ${{ secrets.CRASH_REPORT_TOKEN }}
          CRASH_REPORT_REPO: ${{ vars.CRASH_REPORT_REPO || 'dude555afk/Metrofy' }}

      - name: Sign APK
        uses: ilharp/sign-android-release@v2.0.0
        with:
          releaseDir: app/build/outputs/apk/${{ matrix.variant }}/release/
          signingKey: ${{ secrets.KEYSTORE }}
          keyAlias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
          buildToolsVersion: 35.0.0

      - name: Prepare preview APK
        run: |
          OUTPUT_DIR="app/build/outputs/apk/${{ matrix.variant }}/release"
          mkdir -p release_files
          SIGNED_APK=$(find "$OUTPUT_DIR" \( -name "*-signed.apk" -o -name "*-unsigned-signed.apk" \) | head -1)
          test -n "$SIGNED_APK"
          cp "$SIGNED_APK" "release_files/${{ matrix.outputName }}"

      - name: Upload preview APK
        uses: actions/upload-artifact@v6
        with:
          name: metrolist-13-7-preview-${{ matrix.variant }}
          path: release_files/*.apk

  release:
    name: Publish GitHub Pre-release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download APKs
        uses: actions/download-artifact@v7
        with:
          path: downloaded_artifacts

      - name: Collect APKs
        run: |
          mkdir -p release_files
          find downloaded_artifacts -name "*.apk" -exec cp {} release_files/ \;
          ls -lh release_files

      - name: Read preview version
        id: version
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          TAG="v$VERSION"
          cat > preview_notes.md <<'EOF'
          Metrofy curated Metrolist 13.7 backport preview.

          Preserves Metrofy's Spotify metadata/Canvas/mapping, Qobuz fallback,
          updater, Smart Queue, download manager, and custom YouTube playback recovery.

          Backported/upgraded in this preview:
          - Repeat + shuffle state preservation through crossfade
          - Copyable, privacy-safe playback error reports with Metrofy stream diagnostics
          - PCM-based per-player volume normalization instead of Android LoudnessEnhancer
          - Beginning/end local playlist insertion preference
          - Smarter Android Auto voice search with exact playlist and fuzzy song matching
          - Cached now-playing Room flows for faster resume UI

          This is a pre-release for device testing. It is not merged into main.
          EOF

          gh release create "$TAG" \
            --title "$VERSION" \
            --notes-file preview_notes.md \
            --prerelease \
            --target "$GITHUB_SHA" \
            release_files/*.apk
