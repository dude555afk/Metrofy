name: Quick Test Build

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths-ignore:
      - "README.md"
      - "fastlane/**"
      - "assets/**"
      - "docs/**"
      - ".github/**/*.md"
      - ".github/FUNDING.yml"
      - ".github/ISSUE_TEMPLATE/**"

permissions:
  contents: read

jobs:
  build_quick:
    name: Quick Universal Release Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Init metroproto submodule
        run: git submodule update --init metroproto

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_KEY }}
          cache-cleanup: on-success

      - name: Setup and Generate Protobuf
        uses: ./.github/actions/setup-protobuf

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK (No Lint)
        run: ./gradlew --console=plain assembleFossRelease --warning-mode summary -x lint -x lintFossRelease
        env:
          METROLIST_APPLICATION_ID: com.metrofy.app.test
          METROLIST_APP_NAME: Metrofy Testing
          PULL_REQUEST: "false"
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          # Without these the in-app crash/ANR reporter silently disables itself
          # (CrashReporter.isEnabledSafe), so tester builds report nothing.
          CRASH_REPORT_TOKEN: ${{ secrets.CRASH_REPORT_TOKEN }}
          CRASH_REPORT_REPO: ${{ vars.CRASH_REPORT_REPO || 'dude555afk/Metrofy' }}

      # This build uses a separate .test package, so a disposable CI-only key
      # cannot overwrite the identity of an installed production Metrofy APK.
      # Official releases remain signed ONLY by the original release key.
      - name: Sign test APK using disposable CI key
        shell: bash
        run: |
          set -euo pipefail
          output_dir="app/build/outputs/apk/foss/release"
          unsigned="$(find "$output_dir" -maxdepth 1 -type f -name '*-unsigned.apk' -print -quit)"
          if [[ -z "$unsigned" ]]; then
            echo "::error::Gradle did not produce an unsigned FOSS release APK."
            exit 1
          fi
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          build_tools="$(find "$sdk/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          [[ -x "$build_tools/zipalign" && -x "$build_tools/apksigner" ]] || {
            echo "::error::Android build tools with zipalign/apksigner are unavailable."
            exit 1
          }
          key="$RUNNER_TEMP/metrofy-ci-test.p12"
          keytool -genkeypair -noprompt -storetype PKCS12 \
            -keystore "$key" -storepass android -keypass android \
            -alias metrofytest -keyalg RSA -keysize 2048 -validity 30 \
            -dname "CN=Metrofy CI Test, O=Metrofy"
          mkdir -p "$output_dir/out"
          "$build_tools/zipalign" -f -p 4 "$unsigned" "$RUNNER_TEMP/metrofy-test-aligned.apk"
          "$build_tools/apksigner" sign \
            --ks "$key" --ks-key-alias metrofytest \
            --ks-pass pass:android --key-pass pass:android \
            --out "$output_dir/out/Metrofy-testing.apk" \
            "$RUNNER_TEMP/metrofy-test-aligned.apk"
          "$build_tools/apksigner" verify --verbose "$output_dir/out/Metrofy-testing.apk"
          echo "### CI test APK" >> "$GITHUB_STEP_SUMMARY"
          echo "Signed with a temporary test key, package com.metrofy.app.test. This does NOT replace the official release signer and cannot update APKs from earlier CI runs." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload installable test APK
        uses: actions/upload-artifact@v6
        with:
          name: Metrofy-testing-disposable-signature
          path: app/build/outputs/apk/foss/release/out/Metrofy-testing.apk
          if-no-files-found: error
