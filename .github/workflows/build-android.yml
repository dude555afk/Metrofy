name: Metrofy Android Debug APK

on:
  push:
    branches:
      - metrofy-v2
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: metrofy-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Remove temporary import branch
        run: |
          if git ls-remote --exit-code --heads origin refs/heads/bootstrap/import-v14 >/dev/null; then
            git push origin --delete bootstrap/import-v14
          else
            echo 'Temporary import branch already deleted.'
          fi

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install \
            "platforms;android-37.1" \
            "build-tools;37.0.0" \
            "ndk;30.0.16248370"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew :androidApp:assembleDebug --no-daemon --stacktrace

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: metrofy-v2-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
