name: Metrofy Preview Release

on:
  push:
    branches:
      - feat/player-motion-polish-20261014
    paths:
      - .github/workflows/metrofy-preview-release.yml
      - app/build.gradle.kts
      - app/src/main/kotlin/com/metrolist/music/ui/component/BottomSheet.kt
      - app/src/test/kotlin/com/metrolist/music/ui/component/BottomSheetSettlingTest.kt
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metrofy-preview-${{ github.ref }}
  cancel-in-progress: false

env:
  PREVIEW_TAG: v0.8.9.7-preview.1
  METROFY_PREVIEW_BUILD: "true"
  METROLIST_APPLICATION_ID: com.metrofy.app.preview
  METROLIST_APP_NAME: Metrofy Preview

jobs:
  build:
    if: github.repository == 'dude555afk/Metrofy'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: foss
            variantName: Foss
            apkName: Metrofy-Preview.apk
          - variant: gms
            variantName: Gms
            apkName: Metrofy-Preview-with-Google-Cast.apk

    steps:
      - uses: actions/checkout@v6
      - name: Initialize protobuf submodule
        run: git submodule update --init metroproto
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-disabled: true
      - uses: ./.github/actions/setup-protobuf
      - name: Build and lint preview APK
        run: |
          chmod +x gradlew
          ./gradlew --no-configuration-cache --console=plain assemble${{ matrix.variantName }}Release :app:lint${{ matrix.variantName }}Release --warning-mode summary
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          PULL_REQUEST: "false"
          GITHUB_EVENT_NAME: ${{ github.event_name }}

      - name: Sign preview APK using existing release signing key
        uses: ilharp/sign-android-release@v2.0.0
        with:
          releaseDir: app/build/outputs/apk/${{ matrix.variant }}/release/
          signingKey: ${{ secrets.KEYSTORE }}
          keyAlias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
          buildToolsVersion: 35.0.0

      - name: Verify signing, package identity and version
        shell: bash
        run: |
          set -euo pipefail
          dir="app/build/outputs/apk/${{ matrix.variant }}/release"
          signed_apk="$(find "$dir" -maxdepth 1 -type f -name '*-signed.apk' -print -quit)"
          test -n "$signed_apk"
          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$aapt"
          test -x "$apksigner"
          "$apksigner" verify --verbose "$signed_apk"
          info="$("$aapt" dump badging "$signed_apk" | head -n 1)"
          echo "$info"
          echo "$info" | grep -F "name='com.metrofy.app.preview'"
          echo "$info" | grep -F "versionName='0.8.9.7-preview.1'"
          mkdir -p preview-output
          cp "$signed_apk" "preview-output/${{ matrix.apkName }}"
      - name: Upload verified preview APK
        uses: actions/upload-artifact@v6
        with:
          name: preview-${{ matrix.variant }}
          path: preview-output/*.apk
          if-no-files-found: error

  publish:
    name: Publish prerelease only after both APKs succeed
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        with:
          pattern: preview-*
          path: preview-artifacts
          merge-multiple: true
      - name: Create isolated GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -s preview-artifacts/Metrofy-Preview.apk
          test -s preview-artifacts/Metrofy-Preview-with-Google-Cast.apk
          if gh release view "$PREVIEW_TAG" >/dev/null 2>&1; then
            echo "::error::Prerelease $PREVIEW_TAG already exists. Refusing to silently replace published builds."
            exit 1
          fi
          cat > preview-notes.md <<'EOF'
          ## Metrofy Player Motion Preview

          This is an **isolated test version** of Metrofy. It installs next to stable Metrofy and **does not overwrite your main app**.

          - **Application ID:** `com.metrofy.app.preview`
          - **App name:** Metrofy Preview
          - **Version:** 0.8.9.7-preview.1 (build 34)
          - Improved mini-player drag snapping and expansion/collapse animations
          - Fixed midpoint calculations and smoother corner animations
          - The in-app updater is disabled in preview builds to prevent installing stable-package APKs over this separate package.

          Download either the normal preview APK or Google Cast preview APK, depending on your device. Preview app data is separate from your stable Metrofy app. This is a test build; report crashes and UI regressions before merging PR #5.
          EOF
          gh release create "$PREVIEW_TAG" \
            --title "Metrofy v0.8.9.7 Preview 1 (Player Motion)" \
            --notes-file preview-notes.md \
            --prerelease \
            --target "$GITHUB_SHA" \
            preview-artifacts/*.apk
